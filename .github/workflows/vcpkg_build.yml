name: CI-Build-Dynamic-Dependency-Cache

# This is a test of building using vcpkg to handle dependencies

# 1. ImageLoaderPlugin declares its dependencies in a vcpkg.json
# 2. Internal ManiVault Studio dependencies are defined in mv_deps.toml
# 3. ManiVault Studio dependency repos are added as submodule on the branch
# 4. An overlays directory is created on the file containing a subdir for each dpendency
#    Each overlay has a portfile pointing to the submodule and a generic vcpkg.json to 
#    build the dependency
# 5. vcpkg install builds alldependencies  
# 6. cmake -B build followed by cmake --build build build this repo
#
# Ultimately the inplace python will be moved to the ManiVaultStudio/github-actions repos
# along with the portfile.cmake template

on:
  push:
    branches:
      - '**'
  workflow_dispatch:


concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Dependencies & Project
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write # Required for writing binary caches to GHCR

    env:
      VCPKG_BINARY_SOURCES: 'clear;oci,ghcr.io/${{ github.repository_owner }}/vcpkg-cache:readwrite'
      VCPKG_DEFAULT_TRIPLET: x64-linux

    steps:
      - name: Checkout consumer repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install System Dependencies & Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build cmake python3

      # Dynamically process mv_deps.toml using inline Python
      - name: Process TOML, Add Submodules & Inject Ports
        shell: bash
        run: |
          python3 - << 'EOF'
          import os
          import subprocess
          import tomllib
          import shutil
          from pathlib import Path

          # Load TOML dependencies
          toml_file = Path("mv_deps.toml")
          if not toml_file.exists():
              print("No mv_deps.toml found, skipping dynamic submodule setup.")
              exit(0)

          with open(toml_file, "rb") as f:
              deps = tomllib.load(f)

          # Get current branch of the consumer repo
          # In PRs, use GITHUB_HEAD_REF; on push, use GITHUB_REF_NAME
          consumer_branch = os.getenv("GITHUB_HEAD_REF") or os.getenv("GITHUB_REF_NAME", "main")
          print(f"Consumer active branch: {consumer_branch}")
          workspace = Path(os.getenv("GITHUB_WORKSPACE", "."))
          template_port = Path(workspace, ".github/templates/portfile.cmake")

          for key, config in deps.items():
              repo = config["repo"]
              package_name = config.get("package", key)
              ref = config.get("ref", "main")
              match_branch = config.get("match_branch", False)

              # Determine target branch
              target_branch = ref
              if match_branch:
                  # Check if target branch exists on remote repository
                  ls_remote = subprocess.run(
                      ["git", "ls-remote", "--heads", f"https://github.com/{repo}.git", consumer_branch],
                      capture_output=True, text=True
                  )
                  if ls_remote.returncode == 0 and consumer_branch in ls_remote.stdout:
                      target_branch = consumer_branch
                      print(f"[{package_name}] Branch match found! Using: {target_branch}")
                  else:
                      print(f"[{package_name}] Branch '{consumer_branch}' not found on remote. Falling back to: {target_branch}")

              submodule_dir = Path("external") / package_name
              port_dir = Path("ports") / package_name

              # 1. Add submodule if not present
              if not submodule_dir.exists():
                  repo_url = f"https://github.com/{repo}.git"
                  print(f"Adding submodule {package_name} (branch: {target_branch})...")
                  subprocess.run(
                      ["git", "submodule", "add", "-b", target_branch, repo_url, str(submodule_dir)],
                      check=True
                  )
              
              # Ensure submodule is initialized and updated
              subprocess.run(["git", "submodule", "update", "--init", "--recursive", str(submodule_dir)], check=True)

              # 2. Inject overlay portfile into ports/<package_name>/portfile.cmake
              port_dir.mkdir(parents=True, exist_ok=True)
              target_portfile = port_dir / "portfile.cmake"
              shutil.copy(template_port, target_portfile)
              print(f"Injected portfile for {package_name} -> {target_portfile}")

          EOF

      # vcpkg automatically resolves ports under ./ports based on vcpkg-configuration.json
      - name: Run vcpkg Install
        run: |
          vcpkg install

      - name: Configure & Build Consumer Project
        run: |
          cmake -B build -S . \
            -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE=${VCPKG_ROOT}/scripts/buildsystems/vcpkg.cmake
          cmake --build build --config Release