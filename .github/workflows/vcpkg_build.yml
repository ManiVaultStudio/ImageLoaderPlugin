name: VcpkgTestWorkflow

# This is a test of building using vcpkg to handle dependencies

# 1. ImageLoaderPlugin declares its dependencies in a vcpkg.json
# 2. Internal ManiVault Studio dependencies are defined in mv_deps.toml
# 3. ManiVault Studio dependency repos are added as submodule on the branch
# 4. An overlays directory is created on the file containing a subdir for each dpendency
#    Each overlay has a portfile pointing to the submodule and a generic vcpkg.json to 
#    build the dependency
# 5. vcpkg install builds alldependencies  
# 6. cmake -B build followed by cmake --build build build this repo
#
# Ultimately the inplace python will be moved to the ManiVaultStudio/github-actions repos
# along with the portfile.cmake template

on:
  push:
    branches:
      - '**'
  workflow_dispatch:


concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Dependencies & Project
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write # Required for writing binary caches to GHCR

    env:
      VCPKG_BINARY_SOURCES: 'clear;oci,ghcr.io/${{ github.repository_owner }}/vcpkg-cache:readwrite'
      VCPKG_DEFAULT_TRIPLET: x64-linux

    steps:
      - name: Checkout consumer repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build cmake python3

      # Process mv_deps.toml to produce 
      # an overlay for the ManiVault dependencies
      - name: Create overlay from mv_deps.toml
        shell: bash
        run: |
          python3 $GITHUB_WORKSPACE/.github/scripts/create_overlay.py
          ls -R ./ports

      # vcpkg automatically resolves ports under ./ports based on vcpkg-configuration.json
      - name: Run vcpkg Install
        run: |
          vcpkg --debug install

      - name: Configure & Build Consumer Project
        run: |
          cmake -B build -S . \
            -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE=${VCPKG_ROOT}/scripts/buildsystems/vcpkg.cmake
          cmake --build build --config Release